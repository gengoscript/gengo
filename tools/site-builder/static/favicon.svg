<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Closed book, front 3/4 view: spine (left) + cover (center) + page edge (right) -->

  <!-- Spine -->
  <path d="M6 5.5 C6 4.67 6.67 4 7.5 4 H10 V28 H7.5 C6.67 28 6 27.33 6 26.5 Z" fill="#33422a"/>

  <!-- Cover -->
  <rect x="10" y="4" width="15" height="24" fill="#4c5e3d"/>

  <!-- Aged cloth highlight band -->
  <rect x="10" y="4" width="15" height="3" fill="#57694a"/>

  <!-- Decorative binding rules (old hardcover notebook detail) -->
  <rect x="12" y="9" width="11" height="1" fill="#33422a" opacity="0.55"/>
  <rect x="12" y="23" width="11" height="1" fill="#33422a" opacity="0.55"/>

  <!-- Centre plate / label, worn old-book look -->
  <rect x="14.5" y="12.5" width="6" height="7" rx="0.5" fill="none" stroke="#33422a" stroke-width="0.9" opacity="0.6"/>

  <!-- Page edge, peeking past the cover -->
  <rect x="25" y="5.5" width="1.8" height="21" fill="#e7d9b6"/>
  <rect x="25" y="5.5" width="1.8" height="21" fill="#33422a" opacity="0.12"/>

  <!-- Bookmark ribbon -->
  <path d="M17 4 H19.6 V15 L18.3 13 L17 15 Z" fill="#a8783f"/>

  <!-- Overall edge for definition at small sizes -->
  <path d="M7.5 4 H25 V28 H7.5 C6.67 28 6 27.33 6 26.5 V5.5 C6 4.67 6.67 4 7.5 4 Z"
        fill="none" stroke="#22301c" stroke-width="0.8"/>
</svg>
