name: gengo-release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      WASMTIME_VERSION: v46.0.1
      WASMTIME_SHA256: 9ae0b17ea298bcc52277a8208d6ab7fae8e1a89579672f9d82f9d86c116edb62
      BINARYEN_VERSION: version_130
      BINARYEN_SHA256: 0a18362361ad05465118cd8eeb72edaeec89de6894bc283576ef4e07aa3babcc
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install wasmtime
        run: |
          TARBALL="wasmtime-${WASMTIME_VERSION}-x86_64-linux.tar.xz"
          URL="https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/${TARBALL}"
          curl -fsSL "$URL" -o "/tmp/${TARBALL}"
          echo "${WASMTIME_SHA256}  /tmp/${TARBALL}" | sha256sum --check --strict
          tar -xJf "/tmp/${TARBALL}" -C /tmp
          mkdir -p "$HOME/.wasmtime/bin"
          mv "/tmp/wasmtime-${WASMTIME_VERSION}-x86_64-linux/wasmtime" "$HOME/.wasmtime/bin/"
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Install wasm-opt
        run: |
          TARBALL="binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/${TARBALL}" -o "/tmp/${TARBALL}"
          echo "${BINARYEN_SHA256}  /tmp/${TARBALL}" | sha256sum --check --strict
          tar -xzf "/tmp/${TARBALL}"
          echo "$PWD/binaryen-${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Install llvm-strip
        run: sudo apt-get install -y --no-install-recommends llvm

      # ── Gate: run conformance before building release artifacts ─────

      - name: Run unit tests
        run: zig build -Dpreset=1m unit

      - name: Build WASI runtime (Debug)
        run: zig build -Dpreset=1m wasi

      - name: Run conformance tests
        run: zig build -Dpreset=1m test

      # ── WASM artifacts ──────────────────────────────────────────────

      - name: Build WASM artifacts (ReleaseFast)
        run: |
          zig build -Dpreset=1m wasi-release
          zig build -Dpreset=1m engine-release
          zig build -Dpreset=1m engine-release-net
          zig build -Dpreset=1m engine-release-fs
          zig build -Dpreset=1m engine-release-minimal

      - name: Run conformance tests against ReleaseFast WASM
        run: zig build -Dpreset=1m conformance-release

      - name: Optimise and stage WASM artifacts
        run: |
          mkdir -p dist
          for name in gengo-cli gengo-engine gengo-engine-net gengo-engine-fs gengo-engine-minimal; do
            wasm-opt -Oz --strip-debug "build/release/${name}.wasm" -o "dist/${name}.wasm"
          done

      - name: Run conformance tests against packaged WASM
        run: zig build -Dpreset=1m -Dconformance_wasm=dist/gengo-cli.wasm conformance-artifact

      # ── Native CLI per target ──────────────────────────────────────

      - name: Build CLI linux-x86_64
        run: |
          zig build -Dpreset=1m -Dtarget=x86_64-linux cli-release
          llvm-strip zig-out/bin/gengo
          cp zig-out/bin/gengo dist/gengo-linux-x86_64

      - name: Build CLI linux-aarch64
        run: |
          zig build -Dpreset=1m -Dtarget=aarch64-linux cli-release
          llvm-strip zig-out/bin/gengo
          cp zig-out/bin/gengo dist/gengo-linux-aarch64

      - name: Build CLI macos-x86_64
        run: |
          zig build -Dpreset=1m -Dtarget=x86_64-macos cli-release
          cp zig-out/bin/gengo dist/gengo-macos-x86_64

      - name: Build CLI macos-aarch64
        run: |
          zig build -Dpreset=1m -Dtarget=aarch64-macos cli-release
          cp zig-out/bin/gengo dist/gengo-macos-aarch64

      - name: Build CLI windows-x86_64
        run: |
          zig build -Dpreset=1m -Dtarget=x86_64-windows cli-release
          cp zig-out/bin/gengo.exe dist/gengo-windows-x86_64.exe

      # ── Native shared library per target ───────────────────────────

      - name: Build libgengo-engine linux-x86_64
        run: |
          zig build -Dpreset=1m -Dtarget=x86_64-linux engine-native-release
          llvm-strip zig-out/lib/libgengo-engine.so
          cp zig-out/lib/libgengo-engine.so dist/libgengo-engine-linux-x86_64.so

      - name: Build libgengo-engine linux-aarch64
        run: |
          zig build -Dpreset=1m -Dtarget=aarch64-linux engine-native-release
          llvm-strip zig-out/lib/libgengo-engine.so
          cp zig-out/lib/libgengo-engine.so dist/libgengo-engine-linux-aarch64.so

      - name: Build libgengo-engine macos-x86_64
        run: |
          zig build -Dpreset=1m -Dtarget=x86_64-macos engine-native-release
          cp zig-out/lib/libgengo-engine.dylib dist/libgengo-engine-macos-x86_64.dylib

      - name: Build libgengo-engine macos-aarch64
        run: |
          zig build -Dpreset=1m -Dtarget=aarch64-macos engine-native-release
          cp zig-out/lib/libgengo-engine.dylib dist/libgengo-engine-macos-aarch64.dylib

      # ── Release ────────────────────────────────────────────────────

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "${{ github.ref_name }}" in
            *-pre*|*-alpha*|*-beta*|*-rc*) PRERELEASE="--prerelease" ;;
          esac
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "See [CHANGELOG](CHANGELOG.md) for details." \
            $PRERELEASE \
            2>/dev/null || true
          gh release upload "${{ github.ref_name }}" dist/* --clobber
