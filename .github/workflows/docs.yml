name: docs

# The documentation site is built by Gengoscript itself: the workflow builds
# the native CLI, then runs tools/site-builder/site-builder.gengo over docs/.
# Every docs deploy doubles as an end-to-end smoke test of the language.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tools/site-builder/**"
      - "src/**"
      - "build.zig"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build gengo CLI
        run: zig build -Dpreset=1m cli
      - name: Build site with gengo
        run: ./zig-out/bin/gengo --cap fs --mount root=. tools/site-builder/site-builder.gengo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
