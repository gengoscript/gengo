# Example broker config for the gengo ACL plugin.
# Run from this directory:  mosquitto -c mosquitto.conf
listener 1884 127.0.0.1
allow_anonymous true

# Both paths are resolved relative to the broker's working directory;
# use absolute paths when running under systemd.
plugin ./gengo_acl.so
plugin_opt_script policy.gengo
plugin_opt_max_ops 100000

# Uncomment to let the policy script also decide basic auth
# (see func auth in policy.gengo):
# plugin_opt_basic_auth true
